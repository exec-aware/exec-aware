on:
  workflow_dispatch: ~
  schedule:
    # 7:30 on Sundays
    - cron: '30 7 * * 0'
  push:
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'packaging/nix/*.nix'
      - '.github/workfllows/build-nix.yml'

jobs:
  build-nix:
    runs-on: '${{ matrix.os }}'
    strategy:
      matrix:
        os:
          - 'ubuntu-latest'
          - 'ubuntu-24.04-arm'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Run nix checks
        run: |
          nix flake check
