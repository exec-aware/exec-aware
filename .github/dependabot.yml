version: 2
updates:
  - package-ecosystem: 'nix'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'build:'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'ci:'
